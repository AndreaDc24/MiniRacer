<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>MiniRacer</title>
  <link rel="manifest" href="manifest.json" />

  <script>
    (function () {
      function showError(msg) {
        var el = document.getElementById('__err');
        if (!el) {
          el = document.createElement('div');
          el.id = '__err';
          el.style.cssText = 'position:fixed;inset:0;background:#0d0d1a;color:#ff5252;font:13px/1.5 monospace;padding:16px;overflow-y:auto;z-index:99999;white-space:pre-wrap;word-break:break-all';
          el.innerHTML = '<b style="font-size:16px">ERROR LOG</b>\n<span style="color:#888;font-size:11px">tap to dismiss each entry</span>\n\n';
          document.body ? document.body.appendChild(el) : document.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(el); });
        }
        var entry = document.createElement('div');
        entry.style.cssText = 'border:1px solid #ff525244;border-radius:6px;padding:10px;margin-bottom:10px;background:#1a0000;cursor:pointer';
        entry.textContent = new Date().toISOString().slice(11,19) + '  ' + msg;
        entry.addEventListener('click', function(){ entry.remove(); });
        el.appendChild(entry);
      }
      window.addEventListener('error', function(e) {
        showError((e.message || e) + (e.filename ? '\n@ ' + e.filename + ':' + e.lineno : '') + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
      });
      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        showError('Unhandled promise rejection:\n' + (r && r.stack ? r.stack : r));
      });
      window.__showError = showError;
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
